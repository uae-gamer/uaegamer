<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StoreFront</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <main class="container">

        <h1 id="site-name">StoreFront</h1>

        <p id="site-description">
            Connecting to StoreFront backend...
        </p>

        <div id="connection-status" class="status">
            Checking Supabase connection...
        </div>


        <!-- ==================================================
             LOGGED OUT
        =================================================== -->

        <section id="logged-out-section" hidden>

            <h2>Log In</h2>

            <form id="login-form">

                <label for="login-email">Email</label>

                <input
                    id="login-email"
                    type="email"
                    required
                    autocomplete="email"
                >

                <label for="login-password">Password</label>

                <input
                    id="login-password"
                    type="password"
                    required
                    autocomplete="current-password"
                >

                <button type="submit">
                    Log In
                </button>

            </form>

            <p id="login-message"></p>

        </section>


        <!-- ==================================================
             LOGGED IN
        =================================================== -->

        <section id="logged-in-section" hidden>

            <h2>Account</h2>

            <p>
                Signed in as:
                <strong id="user-email"></strong>
            </p>

            <p>
                Username:
                <strong id="username">-</strong>
            </p>

            <p>
                Account role:
                <strong id="user-role">-</strong>
            </p>

            <div id="admin-confirmation" hidden>
                <strong>Admin access confirmed.</strong>
            </div>

            <br>

            <button id="logout-button" type="button">
                Log Out
            </button>

        </section>


        <!-- ==================================================
             PRODUCTS
        =================================================== -->

        <section>

            <h2>Products</h2>

            <div id="products">
                Loading products...
            </div>

        </section>

    </main>


    <!-- Supabase browser library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Our application -->
    <script src="./js/config.js"></script>
    <script src="./js/supabase.js"></script>
    <script src="./js/app.js"></script>

</body>
</html>
