<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="StoreFront">
  <title>StoreFront</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
  (function () {
    try {
      const lang = localStorage.getItem('sf_lang') || 'en';
      const theme = localStorage.getItem('sf_theme') || 'light';
      const cached = JSON.parse(localStorage.getItem('sf_cached_settings') || '{}');

      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      document.documentElement.dataset.theme = theme;

      const root = document.documentElement.style;
      if (cached.theme_color) root.setProperty('--primary', cached.theme_color);
      if (cached.font_size) root.setProperty('--base-font-size', cached.font_size);

      const bodyFont = lang === 'ar' ? cached.font_family_ar : cached.font_family;
      const headerFont = lang === 'ar' ? cached.header_title_font_family_ar : cached.header_title_font_family;
      if (bodyFont) root.setProperty('--body-font', bodyFont);
      if (headerFont) root.setProperty('--header-font', headerFont);
    } catch (_) {}
  })();
  </script>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
<header>
  <div class="shell">
    <div id="brand" class="brand"><h1 id="site-title"></h1></div>
    <p id="site-subtitle" class="subtitle"></p>
    <div class="toolbar">
      <div><button class="mini active" data-lang="en">English</button><button class="mini" data-lang="ar">العربية</button></div>
      <div class="notify-wrap">
        <button id="notify-btn" class="mini hidden">Notifications <span id="notify-badge" class="badge hidden">0</span></button>
        <div id="notify-panel" class="notify-panel hidden"><div class="panel-head"><strong data-i18n="notifications">Notifications</strong><button id="notify-close" class="xbtn">×</button></div><div id="notify-list"></div></div>
      </div>
      <div><button class="mini active" data-theme="light">Light</button><button class="mini" data-theme="dark">Dark</button></div>
    </div>
  </div>
</header>

<main class="shell">
  <nav id="main-nav" class="main-nav"></nav>
  <div id="alert-host"></div>
  <div id="toast-host" class="toast-host" aria-live="polite"></div>
  <section id="view"></section>
</main>

<footer class="shell footer">
  <div id="footer-links" class="footer-links"></div>
  <div id="social-links" class="social-links"></div>
  <p>© <span id="year"></span> <span id="footer-name"></span>. <span data-i18n="rights">All rights reserved.</span></p>
</footer>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-box"><button id="modal-close" class="modal-close">×</button><div id="modal-body"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/config.js"></script>
<script src="./js/supabase.js"></script>
<script src="./js/i18n.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/products.js"></script>
<script src="./js/cart.js"></script>
<script src="./js/admin.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
